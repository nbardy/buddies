<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!--
      crossorigin="use-credentials" is required, not decorative: a manifest is
      fetched with credentials omitted by default, so behind the shared-secret
      auth gate it 401s and the install prompt silently loses the app name,
      icons, and standalone display. Same reason applies to the icons it lists.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#002b36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Buddies</title>
    <script>
      if (window.location.protocol === 'file:') {
        window.location.replace('http://unleashd.localhost/');
      }
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #002b36;
        color: #93a1a1;
      }

      #boot-diagnostic {
        box-sizing: border-box;
        max-width: 34rem;
        margin: 20vh auto 0;
        padding: 1.25rem;
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow-wrap: anywhere;
      }

      #boot-diagnostic[hidden] {
        display: none;
      }

      #boot-diagnostic strong {
        display: block;
        margin-bottom: 0.5rem;
        color: #eee8d5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-diagnostic" role="alert" hidden>
      <strong id="boot-diagnostic-title">Buddies is loading slowly</strong>
      <span id="boot-diagnostic-detail">The app is taking longer than expected to load.</span>
    </div>
    <script>
      (() => {
        const diagnostic = document.getElementById('boot-diagnostic');
        const title = document.getElementById('boot-diagnostic-title');
        const detail = document.getElementById('boot-diagnostic-detail');
        let booted = false;

        const show = (heading, message) => {
          if (booted) return;
          title.textContent = heading;
          detail.textContent = message;
          diagnostic.hidden = false;
        };

        const slowTimer = window.setTimeout(() => {
          show('Buddies is loading slowly', 'Keep this page open while the app finishes loading.');
        }, 8_000);
        // Slow is not failed: this fires when the app has not rendered yet, which
        // right after a dev restart on a loaded machine is Vite transforming the
        // client cold (>45s at load ~340 on 2026-09-25). It used to say "did not
        // start" while the app was about to appear; ready() still clears it.
        // Real failures (script load errors, rejections) use fail() below.
        const timeout = window.setTimeout(() => {
          show(
            'Buddies is still loading',
            'The server is busy (often right after a restart). This page will open by itself; reload only if nothing changes for a few minutes.'
          );
        }, 45_000);

        window.__unleashdBoot = {
          fail: (message) => show('Buddies did not start', message),
          ready: () => {
            booted = true;
            window.clearTimeout(slowTimer);
            window.clearTimeout(timeout);
            diagnostic.remove();
          },
        };

        window.addEventListener(
          'error',
          (event) => {
            const target = event.target;
            if (target instanceof HTMLScriptElement) {
              show(
                'Buddies did not start',
                `Could not load ${target.src || 'the app module'}.`
              );
              return;
            }
            show(
              'Buddies did not start',
              event.message || 'Safari reported an unknown startup error.'
            );
          },
          true
        );

        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          show(
            'Buddies did not start',
            reason instanceof Error ? reason.message : String(reason || 'Unhandled startup error.')
          );
        });
      })();
    </script>
    <script type="module">
      if (window.location.protocol !== 'file:') {
        import('/src/main.tsx');
      }
    </script>
  </body>
</html>
