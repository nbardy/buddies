name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `@nbardy/agent-cli` is a bundled dependency sourced from this submodule.
          # A publish checkout without it can build a workspace-shaped artifact that
          # no clean consumer can reproduce. See the ownership design note §13/10.
          submodules: recursive

      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          # @nbardy/buddies uses node:sqlite (Node >=22.5). CI must exercise the
          # runtime we publish, not merely a compiler that happens to accept its JS.
          node-version: "22.12"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Check catalog is up-to-date
        run: pnpm --filter @unleashd/shared check:catalog

      - name: Check client invariants
        run: pnpm check:client-invariants

      - name: Lint and format check
        run: pnpm lint

      # `pnpm typecheck` runs tsrs, an experimental Rust port of TypeScript. CI runs it AND the
      # reference tsc 7 on every project and fails if either fails or their diagnostics differ
      # (order ignored), so a tsrs regression cannot hide a type error (tools/typecheck.mjs).
      - name: Typecheck (tsrs and tsc 7, cross-checked)
        run: pnpm typecheck:cross-check

      - name: Test server, client, and provider harness boundaries
        run: pnpm test:server && pnpm test:client && pnpm test:cli

      - run: pnpm build

      - name: Test the packed artifact and public API
        run: pnpm test:package && pnpm test:api

      - name: Check version and publish
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "none")
          if [ "$PACKAGE_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION"
            npm publish --access public --provenance
          else
            echo "Version $PACKAGE_VERSION already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
